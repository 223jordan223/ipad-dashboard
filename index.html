<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>iPad Mini Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-cream: #FFF9E6;
      --card-bg: #FFFFFF;
      --text-main: #333333;
      --text-sub: #666666;
      --sakura-pink: #FF8FA3;
      --sakura-light: #FFE3EC;
      --tamago-yellow: #FFB703;
      --matcha-green: #06D6A0;
      --sora-blue: #028090;
      --sora-light: #E0F2F1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 鎖定全螢幕視窗，零捲軸 */
    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    body {
      font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-cream);
      background-image: radial-gradient(var(--sakura-pink) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--text-main);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    /* 1️⃣ 頂部 Header */
    header {
      height: 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 0 16px;
      border-radius: 16px;
      box-shadow: 0 3px 8px rgba(255, 143, 163, 0.15);
      border: 2px solid var(--sakura-light);
      flex-shrink: 0;
    }

    .time-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .time-display {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--sora-blue);
      line-height: 1;
      letter-spacing: 1px;
    }

    .date-display {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--sakura-pink);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .last-update {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-sub);
      background: #F1F3F5;
      padding: 4px 8px;
      border-radius: 8px;
      line-height: 1.2;
      text-align: right;
    }

    .refresh-btn {
      background: var(--tamago-yellow);
      border: none;
      color: #523600;
      font-size: 0.95rem;
      font-weight: 800;
      font-family: inherit;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 0px #C78D00;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .refresh-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .refresh-btn.spinning .icon {
      display: inline-block;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* 2️⃣ 主網格 Bento Grid */
    .dashboard-grid {
      display: flex;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--sakura-light);
      border-radius: 18px;
      padding: 10px 14px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
    }

    .card-weather {
      flex: 1.1;
    }

    .card-bus {
      flex: 1.25;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed var(--sakura-light);
      padding-bottom: 4px;
      flex-shrink: 0;
    }

    .card-title .jp-subtitle {
      font-size: 0.82rem;
      color: var(--sakura-pink);
      background: var(--sakura-light);
      padding: 2px 6px;
      border-radius: 6px;
    }

    /* ☀️ 天氣卡片充實佈局 */
    .weather-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      gap: 6px;
      padding: 4px 0 0 0;
      min-height: 0;
    }

    .weather-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FAFAFA;
      border-radius: 14px;
      padding: 6px 14px;
    }

    .weather-temp {
      font-size: 3.8rem;
      font-weight: 800;
      color: var(--tamago-yellow);
      line-height: 1;
      text-shadow: 2px 2px 0px #FFEBB3;
    }

    .weather-hero-right {
      text-align: right;
    }

    .weather-place-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .weather-desc-text {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--sora-blue);
      margin-top: 2px;
    }

    /* 濕度 + 雨量 + UV 數據行 */
    .weather-metrics {
      display: flex;
      gap: 6px;
    }

    .metric-pill {
      flex: 1;
      background-color: var(--sora-light);
      padding: 4px 6px;
      border-radius: 10px;
      text-align: center;
    }

    .metric-pill .label {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--sora-blue);
    }

    .metric-pill .value {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 1px;
    }

    /* 🌤️ 分時/未來預報 3格膠囊 */
    .forecast-section {
      display: flex;
      gap: 6px;
    }

    .forecast-pill {
      flex: 1;
      background: #FFF5F7;
      border: 1.5px solid var(--sakura-light);
      border-radius: 12px;
      padding: 5px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .forecast-day {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--sakura-pink);
    }

    .forecast-icon {
      font-size: 1.3rem;
      margin: 1px 0;
      line-height: 1;
    }

    .forecast-temp {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* 🚌 巴士卡片填滿佈局 */
    .bus-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      justify-content: space-between;
      min-height: 0;
    }

    .bus-item {
      background-color: #FAFAFA;
      border: 2px solid #EAEAEA;
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1; /* 平分填滿右側 */
    }

    .bus-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bus-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bus-route {
      background: var(--sora-blue);
      color: white;
      font-size: 1.8rem;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 10px;
      min-width: 68px;
      text-align: center;
      box-shadow: 0 3px 0px #01545E;
    }

    .bus-meta .dest {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .bus-meta .stop-name {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--sora-blue);
    }

    .eta-badge {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--matcha-green);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .exact-time {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-main);
      background: #E8ECEF;
      padding: 1px 6px;
      border-radius: 6px;
    }

    .eta-badge.soon {
      color: #FF5A5F;
    }

    /* 下班車獨立膠囊行 */
    .bus-item-bottom {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      border-top: 1px dashed #E0E0E0;
      padding-top: 4px;
      margin-top: 4px;
    }

    .next-label {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-sub);
    }

    .next-pill {
      background: #EBF3F5;
      color: var(--sora-blue);
      font-size: 0.8rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
    }

    /* 3️⃣ 底部 電台卡片 (50px) */
    .radio-card {
      height: 50px;
      background-color: var(--card-bg);
      border: 2px solid var(--sakura-light);
      border-radius: 16px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 3px 8px rgba(255, 143, 163, 0.15);
      flex-shrink: 0;
    }

    .radio-left {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 220px;
    }

    .radio-icon {
      font-size: 1.4rem;
    }

    .radio-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .radio-status {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--sakura-pink);
    }

    .radio-channels {
      display: flex;
      gap: 5px;
    }

    .channel-btn {
      background: #F4F4F4;
      border: none;
      color: var(--text-sub);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }

    .channel-btn.active {
      background-color: var(--sakura-pink);
      color: #fff;
    }

    .play-btn {
      background-color: var(--matcha-green);
      border: none;
      color: #fff;
      padding: 6px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 2px 0px #049D75;
      min-width: 75px;
      text-align: center;
    }

    .play-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .play-btn.playing {
      background-color: var(--tamago-yellow);
      box-shadow: 0 2px 0px #C78D00;
      color: #523600;
    }
  </style>
</head>
<body>

  <!-- 頂部 Header -->
  <header>
    <div class="time-group">
      <div class="time-display" id="clock">--:--:--</div>
      <div class="date-display" id="date">--月--日 🌸</div>
    </div>
    
    <div class="header-right">
      <div class="last-update">
        <div>🌦️ <span id="weather-updated">--:--</span></div>
        <div>🚌 <span id="bus-updated">--:--</span></div>
      </div>
      <button class="refresh-btn" id="refresh-btn" onclick="manualRefresh()">
        <span class="icon">🔄</span> 更新
      </button>
    </div>
  </header>

  <!-- 主內容 Bento Grid -->
  <main class="dashboard-grid">
    <!-- 天氣卡片（已充實中間空白） -->
    <section class="card card-weather">
      <div class="card-title">
        <span>☀️ 大埔即時與分時天氣</span>
        <span class="jp-subtitle">天気予報</span>
      </div>
      <div class="weather-content">
        <!-- 頂部即時氣溫卡 -->
        <div class="weather-hero">
          <div class="weather-temp" id="curr-temp">--°</div>
          <div class="weather-hero-right">
            <div class="weather-place-name" id="weather-place">大埔</div>
            <div class="weather-desc-text" id="weather-desc">載入中...</div>
          </div>
        </div>

        <!-- 3 格即時指標 -->
        <div class="weather-metrics">
          <div class="metric-pill">
            <div class="label">💧 濕度</div>
            <div class="value" id="humidity">--%</div>
          </div>
          <div class="metric-pill" style="background-color: var(--sakura-light);">
            <div class="label" style="color: var(--sakura-pink);">☔ 雨量</div>
            <div class="value" id="taipo-rain">0 mm</div>
          </div>
          <div class="metric-pill">
            <div class="label">☀️ UV</div>
            <div class="value" id="uv-index">--</div>
          </div>
        </div>

        <!-- 🌤️ 分時/未來預報 3格預報 -->
        <div class="forecast-section" id="forecast-container">
          <div class="forecast-pill">
            <div class="forecast-day">明天</div>
            <div class="forecast-icon">🌤️</div>
            <div class="forecast-temp">--° / --°</div>
          </div>
          <div class="forecast-pill">
            <div class="forecast-day">後天</div>
            <div class="forecast-icon">⛅</div>
            <div class="forecast-temp">--° / --°</div>
          </div>
          <div class="forecast-pill">
            <div class="forecast-day">大後天</div>
            <div class="forecast-icon">🌧️</div>
            <div class="forecast-temp">--° / --°</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 巴士 ETA 卡片（填滿右側） -->
    <section class="card card-bus">
      <div class="card-title">
        <span>🚌 往太和 / 大埔方向</span>
        <span class="jp-subtitle">次のバス</span>
      </div>
      <div class="bus-list" id="bus-container">
        <!-- 動態載入巴士卡片 -->
      </div>
    </section>
  </main>

  <!-- 底部 電台卡片 -->
  <footer class="radio-card">
    <div class="radio-left">
      <div class="radio-icon">📻</div>
      <div>
        <div class="radio-title" id="current-station-name">香港電台 第一台</div>
        <div class="radio-status" id="radio-status">準備完了 ✨</div>
      </div>
    </div>

    <div class="radio-channels">
      <button class="channel-btn active" onclick="switchStation(0)">RTHK 1</button>
      <button class="channel-btn" onclick="switchStation(1)">RTHK 2</button>
      <button class="channel-btn" onclick="switchStation(2)">RTHK 4</button>
      <button class="channel-btn" onclick="switchStation(3)">新城知訊</button>
      <button class="channel-btn" onclick="switchStation(4)">新城財經</button>
    </div>

    <button class="play-btn" id="play-toggle-btn" onclick="togglePlay()">▶ 播放</button>
    <audio id="audio-player" preload="none"></audio>
  </footer>

  <script>
    // 📻 電台配置
    const STATIONS = [
      { name: "香港電台 第一台 (新聞/交通)", url: "https://rthkaudio1-lh.akamaihd.net/i/radio1_1@355864/master.m3u8" },
      { name: "香港電台 第二台 (流行/娛樂)", url: "https://rthkaudio2-lh.akamaihd.net/i/radio2_1@355865/master.m3u8" },
      { name: "香港電台 第四台 (古典/音樂)", url: "https://rthkaudio4-lh.akamaihd.net/i/radio4_1@355867/master.m3u8" },
      { name: "新城知訊台 (997)", url: "https://stream.metroradio.com.hk/metroradio/997_aac/playlist.m3u8" },
      { name: "新城財經台 (104)", url: "https://stream.metroradio.com.hk/metroradio/104_aac/playlist.m3u8" }
    ];

    let currentStationIdx = 0;
    const audioEl = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-toggle-btn');
    const statusEl = document.getElementById('radio-status');
    const stationNameEl = document.getElementById('current-station-name');
    const channelBtns = document.querySelectorAll('.channel-btn');

    function switchStation(idx) {
      currentStationIdx = idx;
      channelBtns.forEach((btn, i) => btn.classList.toggle('active', i === idx));
      stationNameEl.textContent = STATIONS[idx].name;

      const wasPlaying = !audioEl.paused;
      audioEl.src = STATIONS[idx].url;
      audioEl.load();
      if (wasPlaying) {
        statusEl.textContent = "連線中 ⏳...";
        audioEl.play().catch(e => { statusEl.textContent = "請點擊播放"; });
      } else {
        statusEl.textContent = "準備完了 ✨";
      }
    }

    function togglePlay() {
      if (audioEl.paused) {
        if (!audioEl.src || audioEl.src === window.location.href) {
          audioEl.src = STATIONS[currentStationIdx].url;
        }
        statusEl.textContent = "連線中 ⏳...";
        audioEl.load();
        
        const playPromise = audioEl.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            playBtn.textContent = "⏸ 暫停";
            playBtn.classList.add('playing');
            statusEl.textContent = "🎶 放送中...";
          }).catch(err => {
            statusEl.textContent = "點擊重試 ❌";
            playBtn.textContent = "▶ 播放";
            playBtn.classList.remove('playing');
          });
        }
      } else {
        audioEl.pause();
        playBtn.textContent = "▶ 播放";
        playBtn.classList.remove('playing');
        statusEl.textContent = "準備完了 ✨";
      }
    }

    audioEl.addEventListener('playing', () => { statusEl.textContent = "🎶 放送中..."; });
    audioEl.addEventListener('waiting', () => { statusEl.textContent = "緩衝中 ⏳..."; });
    audioEl.addEventListener('error', () => { statusEl.textContent = "無法連線 ❌"; });

    // 🕒 時鐘邏輯
    const jpDays = ["日", "月", "火", "水", "木", "金", "土"];
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = 
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      document.getElementById('date').textContent = 
        `${now.getMonth() + 1}月${now.getDate()}日 (${jpDays[now.getDay()]}) 🌸`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 🚌 巴士設定
    const BUS_TRACKS = [
      { id: "kau_liu_ha_64k", route: "64K", bound: "inbound", serviceType: "1", targetStopName: "較寮下", destName: "太和", displayStop: "較寮下" },
      { id: "hang_ha_po_64k", route: "64K", bound: "inbound", serviceType: "1", targetStopName: "坑下甫", destName: "太和", displayStop: "坑下甫" }
    ];
    let cachedStopIds = {};

    // 🌤️ 香港天文台（即時 + 分時預報）
    async function fetchWeather() {
      try {
        // 1. 即時天氣
        const rhrRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const rhrData = await rhrRes.json();
        
        if (rhrData.temperature && rhrData.temperature.data) {
          const tpTemp = rhrData.temperature.data.find(d => d.place.includes('大埔')) || rhrData.temperature.data[0];
          document.getElementById('curr-temp').textContent = `${tpTemp.value}°`;
        }
        if (rhrData.humidity && rhrData.humidity.data.length > 0) document.getElementById('humidity').textContent = `${rhrData.humidity.data[0].value}%`;
        if (rhrData.uvindex && rhrData.uvindex.data && rhrData.uvindex.data.length > 0) {
          document.getElementById('uv-index').textContent = `${rhrData.uvindex.data[0].value}`;
        } else {
          document.getElementById('uv-index').textContent = `0`;
        }
        
        if (rhrData.rainfall && rhrData.rainfall.data) {
          const tpRain = rhrData.rainfall.data.find(d => d.place.includes('大埔'));
          document.getElementById('taipo-rain').textContent = tpRain ? `${tpRain.max} mm` : '0 mm';
        }

        // 2. 9天/分時預報 (抓取未來3格)
        const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        const fndData = await fndRes.json();
        
        if (fndData.weatherForecast && fndData.weatherForecast.length > 0) {
          // 更新今日概況簡述
          document.getElementById('weather-desc').textContent = fndData.weatherForecast[0].forecastWeather.split('。')[0];

          const forecastContainer = document.getElementById('forecast-container');
          forecastContainer.innerHTML = '';

          // 抓取接下來 3 天的預測
          const nextDays = fndData.weatherForecast.slice(1, 4);
          const dayNames = ["明天", "後天", "大後天"];

          nextDays.forEach((item, idx) => {
            const minT = item.forecastMintemp.value;
            const maxT = item.forecastMaxtemp.value;
            
            // 天氣 Emoji 智能對應
            let iconEmoji = "🌤️";
            const desc = item.forecastWeather;
            if (desc.includes("雨") || desc.includes("驟雨")) iconEmoji = "🌧️";
            if (desc.includes("雷")) iconEmoji = "⛈️";
            if (desc.includes("陽光") || desc.includes("天晴")) iconEmoji = "☀️";
            if (desc.includes("多雲") || desc.includes("陰")) iconEmoji = "⛅";

            forecastContainer.innerHTML += `
              <div class="forecast-pill">
                <div class="forecast-day">${dayNames[idx]} (${item.week.replace('星期', '')})</div>
                <div class="forecast-icon">${iconEmoji}</div>
                <div class="forecast-temp">${minT}°-${maxT}°</div>
              </div>
            `;
          });
        }

        const now = new Date();
        document.getElementById('weather-updated').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      } catch (err) {
        console.error("天氣載入錯誤:", err);
      }
    }

    async function resolveStopId(item) {
      if (cachedStopIds[item.id]) return cachedStopIds[item.id];
      try {
        const url = `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${item.route}/${item.bound}/${item.serviceType}`;
        const res = await fetch(url);
        const json = await res.json();
        if (json.data) {
          for (const stopItem of json.data) {
            const stopInfoRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${stopItem.stop}`);
            const stopInfo = await stopInfoRes.json();
            if (stopInfo.data && stopInfo.data.name_tc.includes(item.targetStopName)) {
              cachedStopIds[item.id] = stopItem.stop;
              return stopItem.stop;
            }
          }
        }
      } catch (e) {}
      return null;
    }

    async function fetchBusETA() {
      const container = document.getElementById('bus-container');
      if (container.children.length === 0) {
        BUS_TRACKS.forEach(item => {
          container.innerHTML += `
            <div class="bus-item" id="card-${item.id}">
              <div class="bus-item-top">
                <div class="bus-info">
                  <div class="bus-route">${item.route}</div>
                  <div class="bus-meta">
                    <div class="dest">往 ${item.destName}</div>
                    <div class="stop-name">🚍 ${item.displayStop}</div>
                  </div>
                </div>
                <div class="eta-badge" id="eta-badge-${item.id}">
                  <span>讀取中...</span>
                </div>
              </div>
              <div class="bus-item-bottom" id="eta-sub-${item.id}">
                <span class="next-label">後續班次:</span>
                <span class="next-pill">--</span>
              </div>
            </div>`;
        });
      }

      for (const item of BUS_TRACKS) {
        const badgeEl = document.getElementById(`eta-badge-${item.id}`);
        const subEl = document.getElementById(`eta-sub-${item.id}`);
        try {
          const stopId = await resolveStopId(item);
          if (!stopId) continue;
          const etaUrl = `https://data.etabus.gov.hk/v1/transport/kmb/eta/${stopId}/${item.route}/${item.serviceType}`;
          const res = await fetch(etaUrl);
          const json = await res.json();

          if (json.data && json.data.length > 0) {
            const validEtas = json.data
              .filter(d => d.eta)
              .map(d => {
                const etaDate = new Date(d.eta);
                const diffMin = Math.round((etaDate - new Date()) / 60000);
                const exactHours = String(etaDate.getHours()).padStart(2, '0');
                const exactMinutes = String(etaDate.getMinutes()).padStart(2, '0');
                return {
                  min: diffMin,
                  exactTime: `${exactHours}:${exactMinutes}`
                };
              })
              .filter(d => d.min >= 0);

            if (validEtas.length > 0) {
              const first = validEtas[0];
              const isSoon = first.min <= 3;

              badgeEl.className = `eta-badge ${isSoon ? 'soon' : ''}`;
              badgeEl.innerHTML = `
                <span>${first.min === 0 ? '即將抵達 🏃' : first.min + ' 分鐘'}</span>
                <span class="exact-time">${first.exactTime}</span>
              `;

              const nextEtas = validEtas.slice(1, 3);
              if (nextEtas.length > 0) {
                const nextHtml = nextEtas.map(d => `<span class="next-pill">${d.min}分 (${d.exactTime})</span>`).join('');
                subEl.innerHTML = `<span class="next-label">後續班次:</span> ${nextHtml}`;
              } else {
                subEl.innerHTML = `<span class="next-label">暫無後續班次</span>`;
              }
            } else { 
              badgeEl.innerHTML = `<span style="color:var(--text-sub); font-size:1rem;">沒有班次</span>`; 
              subEl.innerHTML = ``;
            }
          }
        } catch (err) {}
      }
      const now = new Date();
      document.getElementById('bus-updated').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    async function manualRefresh() {
      const btn = document.getElementById('refresh-btn');
      btn.classList.add('spinning');
      await Promise.all([fetchWeather(), fetchBusETA()]);
      setTimeout(() => { btn.classList.remove('spinning'); }, 500);
    }

    fetchWeather();
    fetchBusETA();
    setInterval(fetchWeather, 600000);
    setInterval(fetchBusETA, 30000);
  </script>
</body>
</html>
